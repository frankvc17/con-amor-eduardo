<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>para ti ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background: radial-gradient(circle at 30% 20%, #1a001a, #000 70%);
overflow:hidden;
color:#ff6fa5;
}

/* SECCIONES */
.seccion{
position:absolute;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* CARD */
.card{
width:90%;
max-width:420px;
background: rgba(255,255,255,0.08);
padding:40px 30px;
border-radius:25px;
border:1px solid rgba(255,105,180,0.4);

box-shadow:
0 0 25px rgba(255,105,180,0.4),
0 0 60px rgba(255,105,180,0.15);

backdrop-filter: blur(12px);
text-align:center;

animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(25px) scale(0.95);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

/* INPUT */
input{
width:100%;
padding:12px;
border-radius:20px;
border:1px solid rgba(255,105,180,0.4);
background:transparent;
color:white;
margin-top:10px;
}

/* BUTTON */
button{
margin-top:15px;
padding:12px;
width:100%;
border:none;
border-radius:25px;
background:linear-gradient(45deg,#ff4d88,#ff6fa5);
color:white;
cursor:pointer;
}

/* FINAL */
#final{
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* FOTO */
.foto{
width:220px;
border-radius:20px;
box-shadow:0 0 30px #ff69b4;
}

/* CONTADOR */
#contador{
margin-top:20px;
font-size:25px;
}

/* TEXTO FINAL */
.feliz{
font-family:'Great Vibes';
font-size:45px;
margin-top:15px;
}

/* CORAZONES */
.corazon{
position:fixed;
color:#ff4d88;
animation:subir linear forwards;
}

@keyframes subir{
from{transform:translateY(100vh);opacity:1}
to{transform:translateY(-10vh);opacity:0}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="seccion">
<div class="card">
<h1 style="font-family:'Great Vibes';font-size:50px;">Para Ti ❤️</h1>
<p>Ingresa la contraseña</p>

<input type="password" id="clave">
<button onclick="verificar()">Entrar</button>

<p id="pista" style="display:none;">💡 pista: TQM</p>
</div>
</div>

<!-- CARTA -->
<div id="carta" class="seccion" style="display:none">
<div class="card">
<p id="textoCarta"></p>
<button onclick="mostrarFinal()">Continuar ❤️</button>
</div>
</div>

<!-- FINAL -->
<div id="final" class="seccion">

<img src="https://frankvc17.github.io/con-amor-eduardo/" class="foto">

<div id="contador"></div>

<h1 class="feliz">Te quiero ❤️</h1>

</div>

<!-- YOUTUBE -->
<iframe id="yt"
width="0" height="0"
allow="autoplay"></iframe>

<script>

let intentos=0;

/* LOGIN */
function verificar(){

let clave=document.getElementById("clave").value;

if(clave==="TQM"){

// 🎵 NUEVA CANCIÓN
document.getElementById("yt").src =
"https://www.youtube.com/embed/UNsHyitk6Ps?autoplay=1&loop=1&playlist=UNsHyitk6Ps";

document.getElementById("login").style.display="none";
document.getElementById("carta").style.display="flex";

escribir();

}else{

intentos++;

if(intentos>=3){
document.getElementById("pista").style.display="block";
}

alert("❌ incorrecto");

}

}

/* TEXTO NUEVO */
let msg=`En este día quisiera expresar todo mi amor por ti, me emociona verte todos los días y me gusta pasar tiempo contigo, te quiero ❤️

Para la mujer más linda, te quiero mucho ❤️`;

/* EFECTO ESCRITURA */
function escribir(){
let i=0;
function t(){
if(i<msg.length){
document.getElementById("textoCarta").innerHTML+=msg[i];
i++;
setTimeout(t,30);
}}
t();
}

/* FINAL */
function mostrarFinal(){
document.getElementById("carta").style.display="none";
document.getElementById("final").style.display="flex";
contador();
}

/* CONTADOR 5s */
function contador(){

let t=5;

let intervalo=setInterval(()=>{

document.getElementById("contador").innerHTML=t+"s ❤️";

t--;

if(t<0){
clearInterval(intervalo);
document.getElementById("contador").innerHTML="❤️ TE QUIERO ❤️";
lluviaAmor();
}

},1000);
}

/* EFECTO FINAL */
function lluviaAmor(){

setInterval(()=>{

let e=document.createElement("div");
e.className="corazon";

e.innerHTML = Math.random()>0.5 ? "❤️" : "Te quiero";

e.style.left=Math.random()*100+"vw";
e.style.fontSize=(15+Math.random()*25)+"px";
e.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(e);

setTimeout(()=>e.remove(),6000);

},200);

}

</script>

</body>
</html>
